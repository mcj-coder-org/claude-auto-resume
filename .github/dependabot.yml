# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NuGet dependencies (.NET)
  - package-ecosystem: 'nuget'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      # Group all patch updates together
      nuget-patch:
        applies-to: version-updates
        update-types:
          - 'patch'
      # Group Microsoft packages
      microsoft:
        applies-to: version-updates
        patterns:
          - 'Microsoft.*'
          - 'System.*'
      # Group test packages
      testing:
        applies-to: version-updates
        patterns:
          - 'xunit*'
          - 'Moq*'
          - 'coverlet*'
          - 'AwesomeAssertions'
          - 'NetArchTest*'
          - 'BenchmarkDotNet*'
          - 'Reqnroll*'
      # Group analyzers
      analyzers:
        applies-to: version-updates
        patterns:
          - '*Analyzer*'
          - 'Roslynator*'
          - 'Meziantou*'
          - 'SonarAnalyzer*'
    labels:
      - 'dependencies'
      - 'nuget'

  # npm dependencies (tooling: prettier, husky, secretlint, etc.)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      # Group all npm patch updates
      npm-patch:
        applies-to: version-updates
        update-types:
          - 'patch'
      # Group linting tools
      linting:
        applies-to: version-updates
        patterns:
          - 'prettier'
          - 'eslint*'
          - 'markdownlint*'
          - 'cspell'
      # Group git hooks
      git-hooks:
        applies-to: version-updates
        patterns:
          - 'husky'
          - 'lint-staged'
          - '@commitlint/*'
      # Group security scanning
      security:
        applies-to: version-updates
        patterns:
          - 'secretlint'
          - '@secretlint/*'
    labels:
      - 'dependencies'
      - 'npm'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'github-actions'
