# git-cliff configuration
# See https://git-cliff.org/docs/configuration

[changelog]
# Template for the entire changelog
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
# Template for each release version
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.github.username %} by @{{ commit.github.username }}{% endif %}\
            {% if commit.github.pr_number %} in [#{{ commit.github.pr_number }}](https://github.com/mcj-coder-org/claude-auto-resume/pull/{{ commit.github.pr_number }}){% endif %}
    {%- endfor %}
{% endfor %}\n
"""
# Template for the footer
footer = """
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespace
trim = true

[git]
# Parse conventional commits
conventional_commits = true
# Filter out unconventional commits
filter_unconventional = true
# Process each line of a commit as a separate commit
split_commits = false
# Regex for preprocessing the commit messages
commit_preprocessors = [
    # Remove issue numbers from commits
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
# Regex for parsing and grouping commits
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^docs", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^build", group = "Build System" },
    { message = "^ci", group = "CI/CD" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^deps", group = "Dependencies" },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^revert", group = "Reverted" },
]
# Protect breaking changes from being skipped
protect_breaking_commits = true
# Filter out commits by glob patterns
filter_commits = false
# Tag pattern
tag_pattern = "v[0-9].*"
# Skip tags matching this pattern (e.g., prereleases)
# skip_tags = "v.*-.*"
# Sort commits within each group
sort_commits = "oldest"
# Limit commits per release
# limit_commits = 42

[remote.github]
owner = "mcj-coder-org"
repo = "claude-auto-resume"
