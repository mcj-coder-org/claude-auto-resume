mode: ContinuousDeployment
assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatchTag
tag-prefix: 'v'
next-version: '0.1.0'

branches:
  main:
    regex: ^main$
    mode: ContinuousDeployment
    tag: ''
    increment: Patch
    prevent-increment-of-merged-branch-version: true
    track-merge-target: false
    is-release-branch: true

  develop:
    regex: ^develop$
    mode: ContinuousDeployment
    tag: beta
    increment: Minor
    prevent-increment-of-merged-branch-version: false
    track-merge-target: true
    is-release-branch: false

  feature:
    regex: ^feature[/-]
    mode: ContinuousDeployment
    tag: useBranchName
    increment: Inherit
    prevent-increment-of-merged-branch-version: false
    track-merge-target: false
    is-release-branch: false
    source-branches: ['main', 'develop']

  release:
    regex: ^release[/-]
    mode: ContinuousDeployment
    tag: rc
    increment: None
    prevent-increment-of-merged-branch-version: true
    track-merge-target: false
    is-release-branch: true
    source-branches: ['develop', 'main']

  hotfix:
    regex: ^hotfix[/-]
    mode: ContinuousDeployment
    tag: hotfix
    increment: Patch
    prevent-increment-of-merged-branch-version: true
    track-merge-target: false
    is-release-branch: false
    source-branches: ['main', 'release']

  pull-request:
    regex: ^(pull|pr)[/-]
    mode: ContinuousDeployment
    tag: pr
    increment: Inherit
    prevent-increment-of-merged-branch-version: false
    track-merge-target: false
    is-release-branch: false
    source-branches: ['main', 'develop', 'feature', 'release', 'hotfix']

commit-message-incrementing: Enabled
major-version-bump-message: '^(feat|fix|chore|refactor|perf|style|test|docs|build|ci|revert)(\(.+\))?!:|BREAKING CHANGE:'
minor-version-bump-message: '^feat(\(.+\))?:'
patch-version-bump-message: '^(fix|perf)(\(.+\))?:'

merge-message-formats:
  TurnDiacriticsOff: true

ignore:
  sha: []
